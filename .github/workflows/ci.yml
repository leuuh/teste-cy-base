name: Cypress Test Suite

on:
  push:
    branches: [ main, ci ]
  pull_request:
    branches: [ main ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 18.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 18.18.0
          
      - run: npm install
      - run: npx cypress run