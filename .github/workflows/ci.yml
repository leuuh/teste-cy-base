name: Cypress Test Suite

on:
  push:
    branches: [ main, ci, feat/cypress-cloud ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  cypress-run:
    name: UI + API gravados no Cypress Cloud
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do repositorio de testes (teste-cy-base)
      - name: Checkout dos testes Cypress
        uses: actions/checkout@v4

      # 2. Configurar Node.js compativel com Cypress 15
      - name: Configurar Node.js 18.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 18.18.0

      # 3. Clonar o servidor (hub-de-leitura)
      - name: Clonar hub-de-leitura
        uses: actions/checkout@v4
        with:
          repository: leuuh/hub-de-leitura
          path: hub-de-leitura

      # 4. Instalar dependencias do servidor
      - name: Instalar dependencias do hub-de-leitura
        run: npm install
        working-directory: hub-de-leitura

      # 5. Inicializar o banco de dados
      - name: Inicializar banco de dados
        run: npm run db
        working-directory: hub-de-leitura

      # 6. Iniciar o servidor em background
      - name: Iniciar servidor hub-de-leitura
        run: NODE_ENV=production node src/server.js &
        working-directory: hub-de-leitura

      # 7. Aguardar o servidor estar disponivel na porta 3000
      - name: Aguardar servidor subir (localhost:3000)
        run: |
          echo "Aguardando o servidor subir..."
          for i in {1..30}; do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Servidor no ar!"
              exit 0
            fi
            echo "Tentativa $i/30 - aguardando 2s..."
            sleep 2
          done
          echo "Servidor nao subiu em 60s"
          exit 1

      # 8. Instalar dependencias do Cypress
      - name: Instalar dependencias do Cypress
        run: npm install

      # 9. Rodar os testes gravando no Cypress Cloud
      - name: Rodar testes Cypress
        run: npm run cy:record -- --tag ci,${{ github.ref_name }}
        env:
          CYPRESS_PROJECT_ID: ${{ vars.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
